spring.application.name=core

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myapp}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:password}
spring.flyway.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE

app.auth.jwt-secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
app.auth.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
